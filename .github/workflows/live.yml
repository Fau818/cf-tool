name: Live checks

# The parsers against the real codeforces.com (public pages, no login), so a
# change to Codeforces' markup shows up here before users hit it. A check skips
# (not fails) when Cloudflare challenges the runner.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # NOTE: setup-uv has published no moving major tags (v10) since v8: pin a release
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest -q -rs -m live
