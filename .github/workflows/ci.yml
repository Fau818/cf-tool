name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # NOTE: setup-uv has published no moving major tags (v10) since v8: pin a release
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --extra dev
      - run: uv run --locked black --check cf_tool tests
      - run: uv run --locked flake8 --max-line-length=100 --extend-ignore=E203,W503 cf_tool tests

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15  # NOTE: a hung test fails fast instead of running for 6 hours
    # Windows support is experimental: its result is shown but does not fail the run
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - run: uv run --locked pytest -q
      # every language preset's starter, built and run with the runner's compilers
      - if: matrix.python == '3.13' && matrix.os != 'windows-latest'
        run: uv run --locked pytest -q -rs -m toolchain
