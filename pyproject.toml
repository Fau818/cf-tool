[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-tool"
version = "0.3.0a1"
description = "Codeforces command-line tool: parse, test, submit, watch (a Python port of xalanq/cf-tool)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Fau818"}
]
keywords = ["codeforces", "competitive-programming", "cli", "cp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "click>=8.1.0",
    "curl_cffi>=0.10.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "cryptography>=42.0.0",
    "psutil>=5.9.0",
    "DrissionPage>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "basedpyright>=1.38.0",
]

[project.urls]
Homepage = "https://github.com/Fau818/cf-tool"
Issues = "https://github.com/Fau818/cf-tool/issues"
Changelog = "https://github.com/Fau818/cf-tool/blob/main/CHANGELOG.md"

[project.scripts]
cf = "cf_tool.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cf_tool*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "live: tests that hit the real Codeforces site (opt-in: pytest -m live)",
]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
